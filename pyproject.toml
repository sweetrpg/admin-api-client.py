[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweetrpg-admin-api-client"
version = "0.1.0"
description = "Client library for the SweetRPG Admin API"
readme = "README.md"
license = "MIT"
requires-python = ">= 3.14"
authors = [
    { name = "Paul Schifferer", email = "dm@sweetrpg.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "requests~=2.32",
    "opentelemetry-api",
]

[dependency-groups]
test = [
    "coverage-badge~=1.0",
    "pytest~=9.0",
    "pytest-cov~=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sweetrpg_admin_api_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = [
    "sweetrpg_admin_api_client",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
]
