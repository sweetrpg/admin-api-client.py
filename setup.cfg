[bdist_wheel]
universal = 1

[metadata]
name = sweetrpg-admin-api-client
version = attr: sweetrpg_admin_api_client.__version__
url = https://sweetrpg.com
license = MIT
author = Paul Schifferer
author_email = dm@sweetrpg.com
long_description = file: README.md
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python

[options]
packages = find:
package_dir = =src
include_package_data = true
python_required = >= 3.12

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
filterwarnings =
    error

[coverage:run]
branch = True
source =
    sweetrpg_admin_api_client
    tests

[coverage:paths]
source =
    src

[semantic_release]
version_variable = src/sweetrpg_admin_api_client/__init__.py:__version__
branch = develop
