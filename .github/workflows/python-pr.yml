name: Pull Request

on:
    pull_request:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - pyproject.toml
            - uv.lock
            - ".python-version"
            - ".github/workflows/**"
            - ".github/dependabot.yml"

jobs:
    tests:
        name: Build/test on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: install-uv
              uses: astral-sh/setup-uv@v5
            - name: sync-deps
              run: uv sync --group test --frozen
            - name: tests
              run: uv run pytest -v tests
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage xml
                  uv run coverage html
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: |
                      htmlcov/
                      coverage.xml
            - name: coverage-threshold
              continue-on-error: true
              run: uv run coverage report --fail-under=0
